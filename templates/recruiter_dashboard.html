<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIRELY - דשבורד מגייס</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Arial, Helvetica, sans-serif;
      background: #f0f2f7;
      color: #1a202c;
    }

    html { height: 100%; }

    .dashboard-container {
      min-height: 100%;
      background: #f0f2f7;
    }

    /* ─── HEADER ─────────────────────────────── */
    .header {
      background: white;
      padding: 16px 30px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon { width: 40px; height: 40px; }
    .logo-text { font-size: 24px; font-weight: 800; color: #667eea; letter-spacing: 1px; }

    .user-info { display: flex; align-items: center; gap: 15px; }
    .user-name  { font-weight: 600; color: #2d3748; font-size: 15px; }

    .logout-btn {
      background: #f56565; color: white; border: none;
      padding: 8px 18px; border-radius: 8px; cursor: pointer;
      font-weight: 600; font-size: 14px; transition: .2s;
    }
    .logout-btn:hover { background: #e53e3e; transform: translateY(-1px); }

    /* ─── MAIN ────────────────────────────────── */
    .main-content {
      padding: 28px 30px;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ─── TOAST ───────────────────────────────── */
    .toast {
      position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
      background: #48bb78; color: white; padding: 14px 28px;
      border-radius: 10px; font-weight: 600; font-size: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,.2);
      opacity: 0; pointer-events: none;
      transition: opacity .3s ease, top .3s ease;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.error { background: #f56565; }
    .toast.show  { opacity: 1; top: 90px; }

    /* kept for backward compat */
    .success-message {
      background: #48bb78; color: white; padding: 15px 20px;
      border-radius: 8px; margin-bottom: 20px; text-align: center;
      font-weight: 500; display: none;
    }
    .success-message.show {
      display: block;
      animation: slideDown 0.3s ease;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── PAGE TITLE ──────────────────────────── */
    .page-title {
      font-size: 28px; font-weight: 700; color: #1a202c;
      margin-bottom: 24px; text-align: center;
    }

    /* ─── TABS ────────────────────────────────── */
    .tab-btn {
      padding: 10px 24px; border: none; border-radius: 22px;
      background: #e2e8f0; cursor: pointer; font-weight: 600;
      font-size: 14px; transition: .25s; color: #4a5568;
    }
    .tab-btn.active { background: #667eea; color: white; }

    /* ─── JOBS GRID ───────────────────────────── */
    .jobs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .job-card {
      background: white; border-radius: 14px; padding: 22px 24px;
      box-shadow: 0 3px 14px rgba(0,0,0,.07);
      transition: .25s; cursor: pointer;
      border: 2px solid transparent;
    }
    .job-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(102,126,234,.18);
      border-color: #667eea;
    }

    .job-title  { font-size: 19px; font-weight: 700; color: #1a202c; margin-bottom: 12px; }
    .job-details{ display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
    .job-detail { display: flex; align-items: center; gap: 8px; color: #4a5568; font-size: 14px; }

    .candidates-info {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 14px; border-top: 1px solid #e2e8f0;
    }
    .candidates-count { font-weight: 600; color: #2d3748; font-size: 14px; }
    .new-candidates {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;
    }

    /* ─── JOB DETAILS VIEW ────────────────────── */
    .job-details-view { display: none; }

    /* ─── BACK BUTTON ─────────────────────────── */
    .back-btn {
      background: #718096; color: white; border: none;
      padding: 9px 20px; border-radius: 8px; cursor: pointer;
      font-weight: 600; font-size: 14px; margin-bottom: 18px; transition: .2s;
    }
    .back-btn:hover { background: #4a5568; transform: translateY(-1px); }

    /* ─── JOB HEADER ROW ──────────────────────── */
    .job-header-row {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
    }

    /* ─── FILTERS ─────────────────────────────── */
    .filters {
      background: white; padding: 18px 20px; border-radius: 14px;
      margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.07);
    }

    .filters-top {
      display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap;
    }

    .search-box {
      flex: 1; min-width: 200px;
      padding: 9px 14px; border: 1px solid #e2e8f0; border-radius: 8px;
      font-size: 14px; font-family: inherit; outline: none; transition: .2s;
    }
    .search-box:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.12); }

    .sort-select {
      padding: 9px 12px; border: 1px solid #e2e8f0; border-radius: 8px;
      font-size: 14px; font-family: inherit; background: white; cursor: pointer; outline: none;
    }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .filter-group { display: flex; flex-direction: column; gap: 5px; }
    .filter-label { font-weight: 600; color: #2d3748; font-size: 14px; }
    .filter-select {
      padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 6px;
      font-size: 14px; font-family: inherit; background: white; outline: none;
    }

    .results-info {
      font-size: 13px; color: #718096; font-weight: 500;
      margin: 0 0 10px; text-align: left;
    }

    /* ─── CANDIDATES LIST ─────────────────────── */
    .candidates-list { display: grid; gap: 14px; }

    .candidate-card {
      background: white; border-radius: 14px; padding: 18px 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
      transition: .25s; cursor: pointer;
      border-right: 5px solid #e2e8f0;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
    }
    .candidate-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,.12);
    }
    .candidate-card.is-new       { border-right-color: #667eea; }
    .candidate-card.suitable     { border-right-color: #48bb78; }
    .candidate-card.not-suitable { border-right-color: #f56565; }
    .candidate-card.review       { border-right-color: #ed8936; }

    .card-left  { display: flex; flex-direction: column; gap: 8px; }
    .card-right { display: flex; flex-direction: column; align-items: center; gap: 8px; }

    .candidate-name { font-size: 17px; font-weight: 700; color: #1a202c; }

    .candidate-tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .tag {
      padding: 3px 11px; border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .tag-new          { background: #ebf4ff; color: #3182ce; }
    .tag-processed    { background: #e2e8f0; color: #4a5568; }
    .tag-suitable     { background: #f0fff4; color: #276749; }
    .tag-not-suitable { background: #fff5f5; color: #c53030; }
    .tag-review       { background: #fffaf0; color: #9c4221; }

    .candidate-meta {
      display: flex; gap: 16px; flex-wrap: wrap; color: #718096; font-size: 13px;
    }

    /* ─── MATCH CIRCLE ────────────────────────── */
    .match-circle {
      width: 72px; height: 72px; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px; color: white;
      box-shadow: 0 3px 12px rgba(0,0,0,.15); flex-shrink: 0;
    }
    .match-circle .match-label { font-size: 9px; font-weight: 600; opacity: .9; margin-top: 1px; }
    .match-high    { background: linear-gradient(135deg, #48bb78, #38a169); }
    .match-medium  { background: linear-gradient(135deg, #ed8936, #dd6b20); }
    .match-low     { background: linear-gradient(135deg, #f56565, #e53e3e); }
    .match-unknown { background: linear-gradient(135deg, #a0aec0, #718096); }

    /* ─── EMPTY STATE ─────────────────────────── */
    .empty-state {
      text-align: center; padding: 60px 20px; color: #a0aec0;
    }
    .empty-state .empty-icon { font-size: 52px; margin-bottom: 14px; }
    .empty-state p { font-size: 16px; font-weight: 500; margin: 0; }

    /* ─── LOADING ─────────────────────────────── */
    .loading {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 60px 20px; color: #718096; font-size: 16px;
    }
    .spinner {
      width: 34px; height: 34px; border: 4px solid #e2e8f0;
      border-top-color: #667eea; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── CANDIDATE DETAIL ────────────────────── */
    .candidate-detail-view { display: none; }

    .candidate-profile {
      background: white; border-radius: 14px; padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    .profile-header {
      display: flex; align-items: center; gap: 22px;
      margin-bottom: 28px; padding-bottom: 22px;
      border-bottom: 2px solid #e2e8f0; flex-wrap: wrap;
    }
    .profile-avatar {
      width: 76px; height: 76px; border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: white; font-weight: 700; flex-shrink: 0;
    }
    .profile-info { flex: 1; }
    .profile-name {
      font-size: 26px; font-weight: 800; color: #1a202c; margin-bottom: 6px;
    }
    .profile-match {
      font-size: 22px; font-weight: 600; color: #48bb78;
    }
    .profile-sub {
      color: #718096; font-size: 14px; display: flex; gap: 16px; flex-wrap: wrap;
      margin-top: 4px;
    }
    .profile-match-wrap { margin-right: auto; }

    /* ─── SCORE BREAKDOWN ─────────────────────── */
    .score-breakdown { margin-top: 4px; }
    .score-row {
      display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
    }
    .score-row-label {
      width: 160px; font-size: 13px; font-weight: 600; color: #4a5568;
      flex-shrink: 0; text-align: right;
    }
    .score-bar-wrap {
      flex: 1; background: #e2e8f0; border-radius: 8px; height: 10px; overflow: hidden;
    }
    .score-bar { height: 100%; border-radius: 8px; transition: width .8s ease; }
    .score-bar.green  { background: linear-gradient(90deg, #48bb78, #38a169); }
    .score-bar.orange { background: linear-gradient(90deg, #ed8936, #dd6b20); }
    .score-bar.red    { background: linear-gradient(90deg, #f56565, #e53e3e); }
    .score-row-val {
      font-size: 13px; font-weight: 700; color: #2d3748; width: 48px;
      text-align: left; flex-shrink: 0;
    }

    /* ─── PROFILE SECTIONS ────────────────────── */
    .profile-sections { display: grid; gap: 20px; margin-bottom: 26px; }
    .profile-section {
      background: #f8fafc; padding: 20px 22px; border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .section-title {
      font-size: 16px; font-weight: 700; color: #2d3748;
      margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .section-content { color: #4a5568; line-height: 1.7; font-size: 14px; }

    /* ─── SKILL PILLS ─────────────────────────── */
    .skills-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .skill-pill {
      background: linear-gradient(135deg, #ebf4ff, #e8eeff);
      color: #3182ce; padding: 5px 14px; border-radius: 20px;
      font-size: 13px; font-weight: 600; border: 1px solid #bee3f8;
    }

    /* ─── ACTION BUTTONS ──────────────────────── */
    .action-buttons {
      display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .action-btn {
      flex: 1; min-width: 120px; padding: 12px 20px;
      border: 3px solid transparent; border-radius: 10px;
      font-weight: 700; font-size: 15px; cursor: pointer;
      transition: .22s; display: flex; align-items: center;
      justify-content: center; gap: 8px;
    }
    .action-btn.selected { transform: scale(1.04); box-shadow: 0 4px 16px rgba(0,0,0,.18); }

    .btn-suitable     { background: #f0fff4; color: #276749; border-color: #9ae6b4; }
    .btn-suitable:hover, .btn-suitable.selected { background: #48bb78; color: white; border-color: #48bb78; }

    .btn-not-suitable { background: #fff5f5; color: #c53030; border-color: #feb2b2; }
    .btn-not-suitable:hover, .btn-not-suitable.selected { background: #f56565; color: white; border-color: #f56565; }

    .btn-review       { background: #fffaf0; color: #9c4221; border-color: #fbd38d; }
    .btn-review:hover, .btn-review.selected { background: #ed8936; color: white; border-color: #ed8936; }

    /* ─── NOTES ───────────────────────────────── */
    .notes-section {
      background: #f8fafc; padding: 20px; border-radius: 12px;
      border: 1px solid #e2e8f0; margin-bottom: 20px;
    }
    .notes-label {
      font-weight: 600; color: #2d3748; margin-bottom: 10px; display: block; font-size: 15px;
    }
    .notes-textarea {
      width: 100%; min-height: 100px; padding: 12px;
      border: 1px solid #e2e8f0; border-radius: 8px;
      font-family: inherit; font-size: 14px; resize: vertical;
      outline: none; transition: .2s; line-height: 1.6;
    }
    .notes-textarea:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.12); }

    /* ─── SUBMIT / CLOSE BUTTONS ──────────────── */
    .submit-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; border: none; padding: 12px 30px;
      border-radius: 8px; font-weight: 700; font-size: 15px;
      cursor: pointer; transition: .22s;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,.35); }
    .submit-btn:active { transform: translateY(0); }

    .status-processed {
      background: #e2e8f0; color: #4a5568;
      padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
    }

    /* ─── CV EMBED PANEL (same pattern as HR Manager) ──── */
    .profile-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }
    .cv-embed-panel { position: sticky; top: 90px; }
    .cv-iframe {
      width: 100%;
      height: 700px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
    @media (max-width: 900px) {
      .profile-layout  { grid-template-columns: 1fr; }
      .cv-embed-panel  { position: static; }
    }

    /* ─── STATS SUMMARY PANEL ────────────────── */
    .stats-panel {
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      padding: 24px 28px;
      margin-bottom: 28px;
    }
    .stats-panel-title {
      font-size: 15px; font-weight: 700; color: #4a5568;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
    }
    .stats-row {
      display: flex; flex-wrap: wrap; gap: 0;
    }
    .stats-row + .stats-divider {
      border: none; border-top: 1px solid #e2e8f0; margin: 18px 0;
    }
    .stats-divider {
      border: none; border-top: 1px solid #e2e8f0; margin: 18px 0;
    }
    .stats-group-label {
      font-size: 11px; font-weight: 700; color: #a0aec0;
      text-transform: uppercase; letter-spacing: .7px;
      margin-bottom: 12px;
    }
    .stat-item {
      flex: 1; min-width: 100px;
      padding: 8px 16px;
      border-right: 1px solid #e2e8f0;
      display: flex; flex-direction: column; gap: 4px;
      text-decoration: none; color: inherit;
    }
    .stat-item:first-child { padding-right: 0; }
    .stat-item:last-child  { border-right: none; }
    .stat-item.clickable   { cursor: pointer; transition: background .18s; border-radius: 10px; }
    .stat-item.clickable:hover { background: #f7f8ff; }
    .stat-item.clickable:hover .stat-item-value { color: #667eea; }

    .stat-item-icon  { font-size: 16px; line-height: 1; }
    .stat-item-value {
      font-size: 26px; font-weight: 800; color: #1a202c;
      line-height: 1; transition: color .18s;
    }
    .stat-item-value.green  { color: #38a169; }
    .stat-item-value.orange { color: #dd6b20; }
    .stat-item-value.red    { color: #e53e3e; }
    .stat-item-value.purple { color: #6b46c1; }
    .stat-item-value.gray   { color: #718096; }
    .stat-item-label { font-size: 12px; font-weight: 600; color: #718096; }

    .stats-loading {
      text-align: center; padding: 18px; color: #a0aec0; font-size: 14px;
    }

    /* ─── RESPONSIVE ──────────────────────────── */
    @media (max-width: 768px) {
      .header { padding: 14px 16px; flex-direction: column; gap: 12px; }
      .main-content { padding: 18px 14px; }
      .jobs-grid { grid-template-columns: 1fr; }
      .filters-grid { grid-template-columns: 1fr 1fr; }
      .candidate-card { grid-template-columns: 1fr; }
      .card-right { flex-direction: row; justify-content: flex-start; }
      .action-buttons { flex-direction: column; }
      .action-btn { min-width: auto; }
      .score-row-label { width: 120px; font-size: 12px; }
      .profile-header { flex-direction: column; align-items: flex-start; }
      .profile-match-wrap { margin-right: 0; }
    }
    @media (max-width: 480px) {
      .filters-grid { grid-template-columns: 1fr; }
    }

    /* Close-job modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-box {
      background: white;
      border-radius: 14px;
      padding: 32px;
      width: 420px;
      max-width: 90vw;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 20px;
    }
    .reason-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      font-size: 14px;
      color: #2d3748;
    }
    .reason-option:hover { border-color: #667eea; background: #f7f8ff; }
    .reason-option input[type=radio] { accent-color: #667eea; width: 16px; height: 16px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 22px; justify-content: flex-start; }
    .modal-confirm-btn {
      background: #f56565; color: white; border: none;
      padding: 10px 22px; border-radius: 8px; cursor: pointer;
      font-weight: 600; font-size: 14px; transition: background 0.2s;
    }
    .modal-confirm-btn:hover { background: #e53e3e; }
    .modal-cancel-btn {
      background: #e2e8f0; color: #4a5568; border: none;
      padding: 10px 22px; border-radius: 8px; cursor: pointer;
      font-weight: 600; font-size: 14px; transition: background 0.2s;
    }
    .modal-cancel-btn:hover { background: #cbd5e0; }
  </style>
</head>
<body>
  <!-- ─── TOAST ────────────────────────────────── -->
  <div class="toast" id="toast"></div>

  <div class="dashboard-container">
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="24" fill="#667eea" />
          <path d="M14 18h20v3h-20v-3zm0 6h20v3h-20v-3zm0 6h15v3h-15v-3z" fill="white" />
          <circle cx="32" cy="16" r="6" fill="#48bb78" />
          <path d="M30 16l1.5 1.5 3-3" stroke="white" stroke-width="1.5" fill="none" />
        </svg>
        <span class="logo-text">HIRELY</span>
      </div>

      <div class="user-info">
        <span class="user-name">שלום, {{ user_name }}</span>
        <button class="logout-btn" id="logoutBtn">התנתק</button>
      </div>
    </header>

    <main class="main-content">
      <!-- backward-compat success message (hidden, toast replaces it visually) -->
      <div class="success-message" id="successMessage">הפעולה בוצעה בהצלחה!</div>

      <!-- ════════════════════════════════════════
           DASHBOARD VIEW – רשימת משרות
      ════════════════════════════════════════ -->
      <div id="dashboardView">
        <h1 class="page-title" id="dashboardTitle">דשבורד מגייס</h1>

        <!-- ═══ SUMMARY STATS PANEL ═══ -->
        <div class="stats-panel" id="statsSection">
          <div class="stats-loading" id="statsLoading">⏳ טוען נתונים...</div>
          <div id="statsContent" style="display:none;">
            <div class="stats-panel-title">📊 סיכום כללי</div>

            <div class="stats-group-label">משרות</div>
            <div class="stats-row" id="jobStatsRow"></div>

            <hr class="stats-divider">

            <div class="stats-group-label">מועמדים — משרות פתוחות</div>
            <div class="stats-row" id="candStatsRow"></div>
          </div>
        </div>

        <div style="display:flex; gap:10px; margin-bottom:20px; justify-content:center;">
          <button id="openTabBtn"   class="tab-btn active">📂 משרות פתוחות</button>
          <button id="closedTabBtn" class="tab-btn">✅ משרות שטופלו</button>
        </div>
        <!-- חיפוש משרות -->
        <div style="margin-bottom:16px; text-align:center;">
          <input type="text" id="jobSearchInput" placeholder="🔍 חיפוש משרה לפי שם..."
                 oninput="filterJobsGrid()"
                 style="padding:8px 14px; border-radius:8px; border:1px solid #e2e8f0; font-size:14px; width:280px;">
        </div>
        <div class="jobs-grid" id="jobsGrid"></div>
      </div>

      <!-- ════════════════════════════════════════
           JOB DETAILS VIEW – רשימת מועמדים
      ════════════════════════════════════════ -->
      <div id="jobDetailsView" class="job-details-view">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap;">
          <button class="back-btn" id="backToJobs" style="margin-bottom:0;">← חזרה לדשבורד</button>
          <h1 class="page-title" id="jobDetailsTitle" style="margin-bottom:0; flex:1; text-align:center;"></h1>
          <button class="submit-btn" id="closeJobBtn" style="background:#f56565; display:none;" onclick="promptCloseJob()">סגור משרה</button>
        </div>

        <div class="filters">
          <!-- Search + Sort row -->
          <div class="filters-top">
            <input type="text" class="search-box" id="searchBox" placeholder="🔍 חיפוש לפי שם מועמד...">
            <select class="sort-select" id="sortSelect">
              <option value="score-desc">מיון: התאמה ↓</option>
              <option value="score-asc">מיון: התאמה ↑</option>
              <option value="name-asc">מיון: שם א-ת</option>
              <option value="new-first">מיון: חדשים ראשון</option>
            </select>
          </div>

          <div class="filters-grid">
            <div class="filter-group">
              <label class="filter-label">אחוז התאמה</label>
              <select class="filter-select" id="matchFilter">
                <option value="">כל האחוזים</option>
                <option value="high">90%+</option>
                <option value="medium">70-89%</option>
                <option value="low">50-69%</option>
                <option value="very-low">&lt;50%</option>
              </select>
            </div>

            <div class="filter-group">
              <label class="filter-label">גיל</label>
              <select class="filter-select" id="ageFilter">
                <option value="">כל הגילאים</option>
                <option value="young">20-30</option>
                <option value="middle">31-45</option>
                <option value="senior">46+</option>
              </select>
            </div>

            <div class="filter-group">
              <label class="filter-label">שנות ניסיון</label>
              <select class="filter-select" id="experienceFilter">
                <option value="">כל רמות הניסיון</option>
                <option value="junior">0-2 שנים</option>
                <option value="mid">3-7 שנים</option>
                <option value="senior">8+ שנים</option>
              </select>
            </div>

            <div class="filter-group">
              <label class="filter-label">סטטוס</label>
              <select class="filter-select" id="statusFilter">
                <option value="">כל הסטטוסים</option>
                <option value="new">חדש</option>
                <option value="processed">טופל</option>
                <option value="מתאים">מתאים</option>
                <option value="לא מתאים">לא מתאים</option>
                <option value="יש לבדוק">יש לבדוק</option>
              </select>
            </div>
          </div>
        </div>

        <p class="results-info" id="resultsInfo"></p>
        <div class="candidates-list" id="candidatesList"></div>
        <div id="paginationControls" style="display:none;justify-content:center;align-items:center;gap:12px;margin-top:16px;">
          <button id="prevPageBtn" onclick="changePage(-1)"
                  style="padding:7px 16px;border:1px solid #e2e8f0;border-radius:6px;background:white;cursor:pointer;font-size:13px;">
            &#8249; הקודם
          </button>
          <span id="pageInfo" style="font-size:13px;color:#4a5568;"></span>
          <button id="nextPageBtn" onclick="changePage(1)"
                  style="padding:7px 16px;border:1px solid #e2e8f0;border-radius:6px;background:white;cursor:pointer;font-size:13px;">
            הבא &#8250;
          </button>
        </div>
      </div>

      <!-- ════════════════════════════════════════
           CANDIDATE DETAIL VIEW – פרטי מועמד
      ════════════════════════════════════════ -->
      <div id="candidateDetailView" class="candidate-detail-view">
        <button class="back-btn" id="backToCandidates">← חזרה לרשימת מועמדים</button>
        <div class="candidate-profile" id="candidateProfile"></div>
      </div>
    </main>
  </div>

  <script>
    /* ══════════════════════════════════════════════
       STATE
    ══════════════════════════════════════════════ */
    let jobsData              = [];
    let currentTab            = 'open';
    let allJobsData           = [];
    let allClosedJobsData     = [];
    let closedJobsLoaded      = false;
    let currentJobId          = null;
    let currentCandidateId    = null;
    let selectedRecruiterStatus = null;
    let allCandidates         = [];
    let currentPage           = 1;
    let totalPages            = 1;
    const PER_PAGE            = 20;


    /* ══════════════════════════════════════════════
       SCORE HELPERS
    ══════════════════════════════════════════════ */
    const SCORE_DEFS = [
      { label: 'דרישות חובה',  key: 'must_requirements_score', max: 40 },
      { label: 'שנות ניסיון',  key: 'years_experience_score',  max: 30 },
      { label: 'גיל',          key: 'age_score',               max: 10 },
      { label: 'ניי-טו-האב',   key: 'nice_to_have_score',      max: 10 },
      { label: 'מרחק',         key: 'distance_score',          max: 10 },
    ];

    function scoreClass(pct) {
      if (pct == null || isNaN(pct)) return 'match-unknown';
      if (pct >= 70) return 'match-high';
      if (pct >= 50) return 'match-medium';
      return 'match-low';
    }

    function barClass(pct) {
      if (pct >= 70) return 'green';
      if (pct >= 40) return 'orange';
      return 'red';
    }

    function escHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    /* ══════════════════════════════════════════════
       API – LOAD JOBS
    ══════════════════════════════════════════════ */
    async function loadJobsFromApi() {
      document.getElementById('jobsGrid').innerHTML = `
        <div class="loading" style="grid-column:1/-1">
          <div class="spinner"></div><span>טוען משרות...</span>
        </div>`;
      try {
        const res  = await fetch('/api/jobs');
        const data = await res.json().catch(() => ({}));

        if (!res.ok || !data.success) {
          console.error('שגיאה בטעינת משרות:', data.message || res.status);
          document.getElementById('jobsGrid').innerHTML = '';
          return;
        }

        const apiJobs = (data.jobs || []).map(job => ({
          id: job.id,
          title: job.title,
          location: job.location || 'לא צוין מיקום',
          openDate: job.created_at,
          // API returns matched_count (suitable candidates) — totalCandidates was always undefined
          totalCandidates: job.matched_count ?? 0,
          newCandidates: job.newCandidates ?? 0,
          source: 'api',
          is_active: job.is_active,
        }));
        allJobsData = apiJobs;
        jobsData    = apiJobs;
        renderJobsByTab();
      } catch (err) {
        console.error('שגיאת רשת בטעינת משרות:', err);
        document.getElementById('jobsGrid').innerHTML = '';
      }
    }

    async function loadClosedJobsFromApi() {
      document.getElementById('jobsGrid').innerHTML = `
        <div class="loading" style="grid-column:1/-1">
          <div class="spinner"></div><span>טוען משרות סגורות...</span>
        </div>`;
      try {
        const res  = await fetch('/api/jobs/closed');
        const data = await res.json().catch(() => ({}));

        if (!res.ok || !data.success) {
          console.error('שגיאה בטעינת משרות סגורות:', data.message || res.status);
          document.getElementById('jobsGrid').innerHTML = '';
          return;
        }

        allClosedJobsData = (data.jobs || []).map(job => ({
          id: job.id,
          title: job.title,
          location: job.location || 'לא צוין מיקום',
          openDate: job.created_at,
          totalCandidates: job.totalCandidates ?? job.matched_count ?? 0,
          newCandidates: 0,
          is_active: 0,
        }));
        closedJobsLoaded = true;
        jobsData = allClosedJobsData;
        renderJobs();
      } catch (err) {
        console.error('שגיאת רשת בטעינת משרות סגורות:', err);
        document.getElementById('jobsGrid').innerHTML = '';
      }
    }

    /* ══════════════════════════════════════════════
       DASHBOARD STATS
    ══════════════════════════════════════════════ */
    async function loadStats() {
      try {
        const res  = await fetch('/api/recruiter/stats');
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) return;

        const j = data.jobs       || {};
        const c = data.candidates || {};

        // Build a stat-item element.
        // onClick: optional function to run when the item is clicked.
        function statItem(icon, value, label, valueColor, onClick) {
          const el = document.createElement('div');
          el.className = `stat-item${onClick ? ' clickable' : ''}`;
          el.innerHTML = `
            <div class="stat-item-icon">${icon}</div>
            <div class="stat-item-value ${valueColor || ''}">${value ?? 0}</div>
            <div class="stat-item-label">${label}</div>`;
          if (onClick) el.addEventListener('click', onClick);
          return el;
        }

        const jobRow  = document.getElementById('jobStatsRow');
        const candRow = document.getElementById('candStatsRow');
        jobRow.innerHTML  = '';
        candRow.innerHTML = '';

        // Job stats — clicking switches the tab
        [
          { icon: '📂', val: j.total_active, label: 'משרות פתוחות',    color: '',       onClick: () => { currentTab='open';   setActiveTab(); renderJobsByTab(); } },
          { icon: '🗂️', val: j.total_closed, label: 'משרות שטופלו',    color: 'gray',   onClick: () => { currentTab='closed'; setActiveTab(); renderJobsByTab(); } },
          { icon: '🆕', val: j.opened_24h,   label: 'נפתחו ב-24 שעות', color: 'purple', onClick: null },
          { icon: '📅', val: j.opened_7d,    label: 'נפתחו ב-7 ימים',  color: '',       onClick: null },
        ].forEach(({ icon, val, label, color, onClick }) =>
          jobRow.appendChild(statItem(icon, val, label, color, onClick)));

        // Candidate stats — clicking pre-sets the status filter (if already in a job view)
        function filterByStatus(statusVal) {
          // If job details view is visible, apply filter directly
          const jobView = document.getElementById('jobDetailsView');
          if (jobView.style.display !== 'none') {
            document.getElementById('statusFilter').value = statusVal;
            applyFilters();
          }
          // Otherwise just scroll down to the jobs grid as a hint
        }

        [
          { icon: '👤', val: c.total,        label: 'סה"כ מועמדים',     color: '',       onClick: null },
          { icon: '⏳', val: c.awaiting,     label: 'ממתינים לסקירה',   color: 'gray',   onClick: null },
          { icon: '✅', val: c.suitable,     label: 'מתאימים',          color: 'green',  onClick: () => filterByStatus('מתאים')    },
          { icon: '🕓', val: c.review,       label: 'יש לבדוק',         color: 'orange', onClick: () => filterByStatus('יש לבדוק') },
          { icon: '❌', val: c.not_suitable, label: 'לא מתאימים',       color: 'red',    onClick: () => filterByStatus('לא מתאים') },
          { icon: '🆕', val: c.new_24h,      label: 'חדשים ב-24 שעות', color: 'purple', onClick: null },
          { icon: '📅', val: c.new_7d,       label: 'חדשים ב-7 ימים',  color: '',       onClick: null },
        ].forEach(({ icon, val, label, color, onClick }) =>
          candRow.appendChild(statItem(icon, val, label, color, onClick)));

        document.getElementById('statsLoading').style.display = 'none';
        document.getElementById('statsContent').style.display = 'block';
      } catch (err) {
        console.error('[loadStats] error:', err);
        document.getElementById('statsLoading').style.display = 'none';
      }
    }

    function mapCandidateFromApi(apiCandidate) {
      const scores = apiCandidate.scores || {};
      const hasMissingScores = SCORE_DEFS.some(d => scores[d.key] == null);

      // Log the raw API response so field names can be verified in the console
      console.log('[mapCandidateFromApi] raw API candidate:', {
        id:        apiCandidate.id ?? apiCandidate.cv_id,
        education: apiCandidate.education,
        summary:   apiCandidate.summary,
        skills:    apiCandidate.skills,
        experience:apiCandidate.experience,
        status:    apiCandidate.recruiter_status ?? apiCandidate.status,
      });

      return {
        id:              apiCandidate.id ?? apiCandidate.cv_id,
        name:            apiCandidate.name || `מועמד/ת ${apiCandidate.cv_id}`,
        age:             apiCandidate.age,
        experience:      apiCandidate.experience ?? null,
        location:        apiCandidate.location || 'לא צוין',
        matchScore:      apiCandidate.matchScore ?? 0,
        // API returns the field as recruiter_status, not status
        isNew:           !apiCandidate.recruiter_status || apiCandidate.recruiter_status === 'new',
        status:          apiCandidate.recruiter_status || 'new',
        scores,
        hasMissingScores,
        linked_at:       apiCandidate.linked_at,
        // Keep null/undefined distinct from empty string so the detail view
        // can tell "data exists" from "data is truly missing"
        education:       apiCandidate.education  ?? null,
        summary:         apiCandidate.summary    ?? null,
        skills:          apiCandidate.skills     ?? null,
        llm_score:       apiCandidate.llm_score  ?? null,
        llm_flag:        apiCandidate.llm_flag   ?? null,
        reviewer_email:  apiCandidate.reviewer_email ?? null,
        reviewed_at:     apiCandidate.reviewed_at    ?? null,
      };
    }

    /* ══════════════════════════════════════════════
       RENDER JOBS
    ══════════════════════════════════════════════ */
    function renderJobs() {
      const jobsGrid = document.getElementById('jobsGrid');
      jobsGrid.innerHTML = '';

      if (!jobsData.length) {
        jobsGrid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <div class="empty-icon">📋</div>
            <p>אין משרות ${currentTab === 'open' ? 'פתוחות' : 'שטופלו'} כרגע</p>
          </div>`;
        return;
      }

      jobsData.forEach(job => {
        const jobCard = document.createElement('div');
        jobCard.className = 'job-card';
        jobCard.onclick = () => showJobDetails(job.id);

        const openDate        = job.openDate || job.created_at || job.open_date;
        const totalCandidates = job.totalCandidates ?? 0;
        const newCandidates   = job.newCandidates   ?? 0;

        jobCard.innerHTML = `
          <div class="job-title">${escHtml(job.title)}</div>
          <div class="job-details">
            <div class="job-detail"><span>📍</span><span>${escHtml(job.location || 'לא צוין מיקום')}</span></div>
            <div class="job-detail"><span>📅</span><span>נפתח: ${openDate ? formatDate(openDate) : 'לא ידוע'}</span></div>
          </div>
          <div class="candidates-info">
            <span class="candidates-count">👤 ${totalCandidates} מועמדים</span>
            ${newCandidates > 0 ? `<span class="new-candidates">${newCandidates} חדשים</span>` : ''}
          </div>`;

        jobsGrid.appendChild(jobCard);
      });
    }

    function filterJobsGrid() {
      const q = (document.getElementById('jobSearchInput')?.value || '').toLowerCase();
      const source = currentTab === 'open' ? allJobsData : allClosedJobsData;
      jobsData = q ? source.filter(j => (j.title || '').toLowerCase().includes(q)) : source;
      renderJobs();
    }

    function renderJobsByTab() {
      document.getElementById('jobSearchInput').value = '';
      if (currentTab === 'open') {
        jobsData = allJobsData; // /api/jobs already returns only active jobs
        renderJobs();
      } else {
        // Lazy-load closed jobs on first visit to this tab
        if (!closedJobsLoaded) {
          loadClosedJobsFromApi(); // sets jobsData via allClosedJobsData then calls renderJobs
        } else {
          jobsData = allClosedJobsData;
          renderJobs();
        }
      }
    }

    function setActiveTab() {
      document.getElementById('openTabBtn').classList.toggle('active', currentTab === 'open');
      document.getElementById('closedTabBtn').classList.toggle('active', currentTab === 'closed');
    }

    /* ══════════════════════════════════════════════
       SHOW JOB DETAILS
    ══════════════════════════════════════════════ */
    async function showJobDetails(jobId) {
      currentJobId = jobId;
      const job = jobsData.find(j => j.id === jobId) || { title: '' };

      document.getElementById('dashboardView').style.display    = 'none';
      document.getElementById('jobDetailsView').style.display   = 'block';
      document.getElementById('candidateDetailView').style.display = 'none';

      document.getElementById('jobDetailsTitle').textContent = `מועמדים למשרת ${job.title}`;

      document.getElementById('closeJobBtn').style.display = 'inline-block';

      // Reset filters + search
      ['matchFilter','ageFilter','experienceFilter','statusFilter'].forEach(id =>
        document.getElementById(id).value = '');
      document.getElementById('searchBox').value  = '';
      document.getElementById('sortSelect').value = 'score-desc';

      document.getElementById('candidatesList').innerHTML = `
        <div class="loading"><div class="spinner"></div><span>טוען מועמדים...</span></div>`;

      currentPage = 1;
      await fetchCandidatesPage(jobId, currentPage);
      attachFiltersHandlers();
    }

    /* ══════════════════════════════════════════════
       PAGINATION
    ══════════════════════════════════════════════ */
    async function fetchCandidatesPage(jobId, page) {
      document.getElementById('candidatesList').innerHTML =
        `<div class="loading"><div class="spinner"></div><span>טוען מועמדים...</span></div>`;
      try {
        const res  = await fetch(`/api/jobs/${jobId}/candidates?page=${page}&per_page=${PER_PAGE}`);
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.success) {
          allCandidates = (data.candidates || []).map(mapCandidateFromApi);
          totalPages    = data.pages || 1;
          currentPage   = data.page  || 1;
        } else {
          allCandidates = [];
          totalPages = 1;
        }
      } catch (err) {
        console.error('שגיאה בטעינת מועמדים:', err);
        allCandidates = [];
      }
      applyFilters();
      updatePaginationUI();
    }

    function updatePaginationUI() {
      const ctrl = document.getElementById('paginationControls');
      if (totalPages <= 1) { ctrl.style.display = 'none'; return; }
      ctrl.style.display = 'flex';
      document.getElementById('pageInfo').textContent = `עמוד ${currentPage} מתוך ${totalPages}`;
      document.getElementById('prevPageBtn').disabled = currentPage <= 1;
      document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;
    }

    async function changePage(delta) {
      const newPage = currentPage + delta;
      if (newPage < 1 || newPage > totalPages) return;
      currentPage = newPage;
      await fetchCandidatesPage(currentJobId, currentPage);
    }

    /* ══════════════════════════════════════════════
       RENDER CANDIDATES
    ══════════════════════════════════════════════ */
    function renderCandidates(candidates) {
      const list = document.getElementById('candidatesList');
      list.innerHTML = '';

      document.getElementById('resultsInfo').textContent =
        `מציג ${candidates.length} מועמדים מתוך ${allCandidates.length}`;

      if (!candidates.length) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <p>לא נמצאו מועמדים התואמים את הפילטרים</p>
          </div>`;
        return;
      }

      candidates.forEach(candidate => {
        const cardStatus = candidate.status === 'מתאים'    ? 'suitable'
                         : candidate.status === 'לא מתאים' ? 'not-suitable'
                         : candidate.status === 'יש לבדוק' ? 'review'
                         : candidate.isNew                 ? 'is-new' : '';

        const tagInfo = candidate.status === 'מתאים'    ? { cls: 'tag-suitable',     txt: '✅ מתאים' }
                      : candidate.status === 'לא מתאים' ? { cls: 'tag-not-suitable', txt: '❌ לא מתאים' }
                      : candidate.status === 'יש לבדוק' ? { cls: 'tag-review',       txt: '🕓 יש לבדוק' }
                      : candidate.isNew                 ? { cls: 'tag-new',          txt: '🆕 חדש' }
                      : { cls: 'tag-processed', txt: 'טופל' };

        const scoreVal = candidate.matchScore != null ? `${Math.min(100, candidate.matchScore).toFixed(1)}%` : '—';

        const candidateCard = document.createElement('div');
        candidateCard.className = `candidate-card ${cardStatus}`;
        candidateCard.onclick   = () => showCandidateDetails(candidate.id);

        candidateCard.innerHTML = `
          <div class="card-left">
            <div class="candidate-name">${escHtml(candidate.name)}</div>
            <div class="candidate-tags">
              <span class="tag ${tagInfo.cls}">${tagInfo.txt}</span>
            </div>
            <div class="candidate-meta">
              ${candidate.age      != null ? `<span>🎂 גיל ${candidate.age}</span>`             : ''}
              ${candidate.experience != null ? `<span>💼 ${candidate.experience} שנות ניסיון</span>` : ''}
              <span>📍 ${escHtml(candidate.location)}</span>
              <span>🕐 ${timeAgo(candidate.linked_at)}</span>
            </div>
          </div>
          <div class="card-right">
            <div class="match-circle ${scoreClass(candidate.matchScore)}">
              ${scoreVal}
              <span class="match-label">התאמה</span>
            </div>
          </div>`;

        list.appendChild(candidateCard);
      });
    }

    /* ══════════════════════════════════════════════
       FILTERS + SORT + SEARCH
    ══════════════════════════════════════════════ */
    function applyFilters() {
      const search  = document.getElementById('searchBox').value.trim().toLowerCase();
      const matchF  = document.getElementById('matchFilter').value;
      const ageF    = document.getElementById('ageFilter').value;
      const expF    = document.getElementById('experienceFilter').value;
      const statusF = document.getElementById('statusFilter').value;
      const sortVal = document.getElementById('sortSelect').value;

      let list = [...allCandidates];

      if (search) list = list.filter(c => c.name.toLowerCase().includes(search));

      if (matchF) list = list.filter(c => {
        const s = c.matchScore;
        if (matchF === 'high')     return s >= 90;
        if (matchF === 'medium')   return s >= 70 && s < 90;
        if (matchF === 'low')      return s >= 50 && s < 70;
        if (matchF === 'very-low') return s < 50;
        return true;
      });

      if (ageF) list = list.filter(c => {
        const a = c.age;
        if (ageF === 'young')  return a >= 20 && a <= 30;
        if (ageF === 'middle') return a > 30  && a <= 45;
        if (ageF === 'senior') return a > 45;
        return true;
      });

      if (expF) list = list.filter(c => {
        const e = c.experience;
        if (expF === 'junior') return e <= 2;
        if (expF === 'mid')    return e > 2  && e <= 7;
        if (expF === 'senior') return e > 7;
        return true;
      });

      if (statusF) list = list.filter(c => c.status === statusF);

      if (sortVal === 'score-desc') list.sort((a,b) => b.matchScore - a.matchScore);
      if (sortVal === 'score-asc')  list.sort((a,b) => a.matchScore - b.matchScore);
      if (sortVal === 'name-asc')   list.sort((a,b) => a.name.localeCompare(b.name, 'he'));
      if (sortVal === 'new-first')  list.sort((a,b) => (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0));

      renderCandidates(list);
    }

    /* kept for backward compat – some old callers still use filterCandidates() */
    function filterCandidates() { applyFilters(); }

    function attachFiltersHandlers() {
      document.getElementById('matchFilter').onchange      = applyFilters;
      document.getElementById('ageFilter').onchange        = applyFilters;
      document.getElementById('experienceFilter').onchange = applyFilters;
      document.getElementById('statusFilter').onchange     = applyFilters;
      document.getElementById('sortSelect').onchange       = applyFilters;

      let searchTimer;
      document.getElementById('searchBox').oninput = () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(applyFilters, 200);
      };
    }

    /* ══════════════════════════════════════════════
       CANDIDATE DETAIL
    ══════════════════════════════════════════════ */
    async function showCandidateDetails(candidateId) {
      currentCandidateId = candidateId;
      const candidate = allCandidates.find(c => c.id === candidateId);

      document.getElementById('jobDetailsView').style.display      = 'none';
      document.getElementById('candidateDetailView').style.display = 'block';

      // Log what the mapped candidate object actually contains
      console.log('[showCandidateDetails] candidate object:', {
        id:        candidate.id,
        education: candidate.education,
        summary:   candidate.summary,
        skills:    candidate.skills,
        experience:candidate.experience,
        status:    candidate.status,
      });

      // Trigger re-analysis only when BOTH education AND summary are truly absent
      // (null/undefined — not just an empty string from a previous mapping bug).
      const needsAnalysis = candidate.education == null && candidate.summary == null;
      if (needsAnalysis) {
        fetch(`/api/jobs/${currentJobId}/candidates/${candidateId}/reanalyze`, { method: 'POST' })
          .then(() => {
            setTimeout(async () => {
              const res  = await fetch(`/api/jobs/${currentJobId}/candidates?page=${currentPage}&per_page=${PER_PAGE}`).catch(() => null);
              const data = res ? await res.json().catch(() => ({})) : {};
              if (data.candidates) {
                allCandidates = data.candidates.map(mapCandidateFromApi);
                const updated = allCandidates.find(c => c.id === candidateId);
                const detailVisible =
                  document.getElementById('candidateDetailView').style.display !== 'none';
                if (updated && currentCandidateId === candidateId && detailVisible) {
                  showCandidateDetails(candidateId);
                }
              }
            }, 12000);
          });
      }

      const analyzing = '<span style="color:#a0aec0;font-size:12px;">⏳ מנתח...</span>';

      // Patterns of personal/irrelevant info that must never reach the UI.
      // These catch old DB records that were extracted before the stricter prompt.
      const NOISE_PATTERNS = [
        /מספר זהות/,
        /תאריך לידה/,
        /ארץ לידה/,
        /מצב משפחתי/,
        /כתובת[:\s]/,
        /טלפון[:\s]/,
        /דוא["״]ל/,
        /נייד[:\s]/,
        /\d{9}/,          // 9-digit ID number
      ];

      function isNoisyBullet(text) {
        return NOISE_PATTERNS.some(p => p.test(text));
      }

      // Convert a value to an HTML bullet list.
      // Handles: array (new LLM format), plain string (old records / DB fallback), null.
      // Also trims bullets that are over-long (copied paragraphs) or contain personal info.
      function toBullets(val, fallback) {
        if (val == null) return fallback;
        const raw = Array.isArray(val)
          ? val.map(String).map(s => s.trim()).filter(Boolean)
          : String(val).split(/\n|(?<=[.!?])\s+/).map(s => s.trim()).filter(Boolean);

        const items = raw
          .filter(s => !isNoisyBullet(s))          // drop personal-info lines
          .map(s => s.length > 120 ? s.slice(0, 117) + '…' : s)  // hard cap on length
          .filter(Boolean);

        if (!items.length) return fallback;
        return '<ul style="margin:6px 0 0;padding-right:20px;line-height:1.8;">' +
          items.map(item => `<li>${escHtml(item)}</li>`).join('') +
          '</ul>';
      }

      // Each field is evaluated independently — a missing field does not
      // cause sibling fields to show "Analyzing..."
      const education  = toBullets(candidate.education,  needsAnalysis ? analyzing : '—');
      const summary    = toBullets(candidate.summary,    needsAnalysis ? analyzing : '—');
      const experience = candidate.experience != null ? candidate.experience
                       : needsAnalysis        ? analyzing : '—';

      // Skills as pill badges — handles both array (new) and comma string (old)
      const rawSkills = candidate.skills;
      let skillItems = [];
      if (Array.isArray(rawSkills)) {
        skillItems = rawSkills.map(String).map(s => s.trim()).filter(Boolean);
      } else if (typeof rawSkills === 'string' && rawSkills) {
        skillItems = rawSkills.split(/[,،;/\n]+/).map(s => s.trim()).filter(Boolean);
      }
      const skillPills = skillItems.length
        ? skillItems.map(s => `<span class="skill-pill">${escHtml(s)}</span>`).join('')
        : needsAnalysis ? analyzing : '—';

      // Score breakdown with progress bars
      const hasScores = candidate.scores && SCORE_DEFS.some(d => candidate.scores[d.key] != null);
      let scoreRows = '';
      if (hasScores) {
        SCORE_DEFS.forEach(def => {
          const raw = candidate.scores[def.key];
          const pct = raw != null ? Math.round((raw / def.max) * 100) : null;
          const bar = pct != null
            ? `<div class="score-bar-wrap"><div class="score-bar ${barClass(pct)}" style="width:${pct}%"></div></div>`
            : `<div class="score-bar-wrap" style="display:flex;align-items:center;padding:0 8px;"><span style="color:#a0aec0;font-size:12px;">לא זמין</span></div>`;
          scoreRows += `
            <div class="score-row">
              <span class="score-row-label">${def.label}</span>
              ${bar}
              <span class="score-row-val">${raw != null ? `${raw}/${def.max}` : '—'}</span>
            </div>`;
        });
      }

      const existingStatus = (candidate.status !== 'new' && candidate.status !== 'processed')
        ? candidate.status : null;

      document.getElementById('candidateProfile').innerHTML = `
        <div class="profile-header">
          <div class="profile-avatar">${escHtml(candidate.name.charAt(0))}</div>
          <div class="profile-info">
            <div class="profile-name">${escHtml(candidate.name)}</div>
            <div class="profile-sub">
              ${candidate.age != null ? `<span>🎂 גיל ${candidate.age}</span>` : ''}
              ${candidate.experience != null ? `<span>💼 ${candidate.experience} שנות ניסיון</span>` : ''}
              <span>📍 ${escHtml(candidate.location)}</span>
            </div>
          </div>
          <div class="profile-match-wrap" style="text-align:center;">
            <div class="match-circle ${scoreClass(candidate.matchScore)}" style="width:88px;height:88px;font-size:22px;">
              ${candidate.matchScore != null ? `${Math.min(100, candidate.matchScore).toFixed(1)}%` : '—'}
              <span class="match-label">התאמה</span>
            </div>
            ${candidate.llm_score != null ? `
              <div style="margin-top:6px;font-size:11px;color:#718096;">
                ציון AI: ${Math.min(100, candidate.llm_score).toFixed(1)}%
                ${candidate.llm_flag ? ' ⚠️' : ''}
              </div>` : ''}
          </div>
        </div>

        <div class="profile-layout">
          <!-- Left column: info + actions + notes -->
          <div>
            <div class="profile-sections">
              <div class="profile-section">
                <div class="section-title">👤 פרטים אישיים</div>
                <div class="section-content">
                  <strong>גיל:</strong> ${candidate.age != null ? candidate.age : needsAnalysis ? analyzing : '—'}<br>
                  <strong>מיקום:</strong> ${candidate.location ? escHtml(candidate.location) : 'לא צוין'}<br>
                  <strong>שנות ניסיון:</strong> ${experience}
                </div>
              </div>

              <div class="profile-section">
                <div class="section-title">🎓 השכלה</div>
                <div class="section-content">${education}</div>
              </div>

              <div class="profile-section">
                <div class="section-title">💡 כישורים טכניים</div>
                <div class="skills-pills">${skillPills}</div>
              </div>

              <div class="profile-section">
                <div class="section-title">📝 תקציר מקצועי</div>
                <div class="section-content" style="line-height:1.7;">${summary}</div>
              </div>

              ${hasScores ? `
              <div class="profile-section">
                <div class="section-title">📊 פירוט ציון התאמה</div>
                <div class="score-breakdown">${scoreRows}</div>
              </div>` : ''}
            </div>

            <div class="action-buttons" id="statusButtons">
              <button type="button" class="action-btn btn-suitable ${existingStatus === 'מתאים' ? 'selected' : ''}"
                onclick="updateCandidateStatus('מתאים', this)">✅ מתאים</button>
              <button type="button" class="action-btn btn-not-suitable ${existingStatus === 'לא מתאים' ? 'selected' : ''}"
                onclick="updateCandidateStatus('לא מתאים', this)">❌ לא מתאים</button>
              <button type="button" class="action-btn btn-review ${existingStatus === 'יש לבדוק' ? 'selected' : ''}"
                onclick="updateCandidateStatus('יש לבדוק', this)">🕓 יש לבדוק</button>
            </div>

            <div class="notes-section">
              <label class="notes-label">הערה למנהל הגיוס:</label>
              <textarea class="notes-textarea" id="candidateNotes" placeholder="הזן הערות או הערכות נוספות..."></textarea>
              <div style="margin-top:12px;">
                <label style="font-size:13px;font-weight:600;color:#4a5568;display:block;margin-bottom:6px;">
                  ציון לפי דעתך (0-100) — אופציונלי
                </label>
                <div style="display:flex;align-items:center;gap:12px;">
                  <input type="range" id="humanScoreSlider" min="0" max="100" value="50" disabled
                         style="flex:1;" oninput="document.getElementById('humanScoreDisplay').textContent=this.value+'%'">
                  <span id="humanScoreDisplay" style="font-size:14px;font-weight:700;color:#667eea;min-width:40px;">50%</span>
                  <label style="font-size:12px;color:#a0aec0;display:flex;align-items:center;gap:4px;">
                    <input type="checkbox" id="humanScoreEnabled"
                           onchange="document.getElementById('humanScoreSlider').disabled=!this.checked">
                    תן ציון
                  </label>
                </div>
              </div>
            </div>

            <button class="submit-btn" onclick="submitCandidateReview()">📤 שלח הערכה</button>
          </div>

          <!-- Right column: CV embed (same as HR Manager) -->
          <div class="cv-embed-panel">
            <div class="candidate-profile" id="cvEmbedPanel" style="padding:20px;"></div>
          </div>
        </div>
      `;

      if (existingStatus) selectedRecruiterStatus = existingStatus;

      // Render the CV iframe in the right column (same as HR Manager)
      renderCvEmbed(candidateId);
    }

    /* Identical to HR Manager implementation — reuses same API endpoint */
    async function renderCvEmbed(cvId) {
      const pdfUrl      = `/api/candidates/${cvId}/cv-file-pdf`;
      const downloadUrl = `/api/candidates/${cvId}/cv-file?download=1`;
      const panel = document.getElementById('cvEmbedPanel');
      if (!panel) return;

      panel.innerHTML = `
        <div style="font-size:15px;font-weight:700;color:#2d3748;margin-bottom:14px;">קורות חיים (אנונימיים)</div>
        <div class="loading" style="height:200px;"><div class="spinner"></div><span>טוען קובץ...</span></div>`;

      const docxPlaceholder = () => `
        <div style="font-size:15px;font-weight:700;color:#2d3748;margin-bottom:14px;">קורות חיים (אנונימיים)</div>
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
              height:220px;background:#f8fafc;border-radius:12px;border:1px solid #e2e8f0;
              gap:12px;text-align:center;padding:24px;">
          <div style="font-size:40px;">📄</div>
          <div style="font-weight:600;font-size:14px;color:#4a5568;">תצוגה מקדימה אינה זמינה לקבצי Word</div>
          <div style="font-size:12px;color:#a0aec0;">לחץ על הכפתור להורדה וצפייה</div>
          <a href="${downloadUrl}"
             style="margin-top:4px;padding:9px 22px;background:#667eea;color:white;border-radius:8px;
                    text-decoration:none;font-weight:600;font-size:13px;">
            ⬇ הורד קורות חיים
          </a>
        </div>`;

      try {
        const check = await fetch(pdfUrl);
        const contentType = check.headers.get('content-type') || '';

        if (!check.ok || contentType.includes('application/json')) {
          // Conversion failed or file missing — show DOCX placeholder with download button
          panel.innerHTML = docxPlaceholder();
          return;
        }

        // PDF available — embed inline
        panel.innerHTML = `
          <div style="font-size:15px;font-weight:700;color:#2d3748;margin-bottom:14px;">קורות חיים (אנונימיים)</div>
          <iframe class="cv-iframe" src="${pdfUrl}" title="קורות חיים"></iframe>
          <div style="margin-top:12px;text-align:center;">
            <a href="${downloadUrl}" style="font-size:13px;color:#667eea;text-decoration:none;font-weight:600;">⬇ הורד קובץ</a>
          </div>`;
      } catch (err) {
        panel.innerHTML = docxPlaceholder();
      }
    }

    function updateCandidateStatus(status, btn) {
      selectedRecruiterStatus = status;

      const profile = document.getElementById('candidateProfile');
      if (profile) profile.dataset.selectedStatus = status;

      document.querySelectorAll('#statusButtons .action-btn').forEach(b => b.classList.remove('selected'));
      if (btn) btn.classList.add('selected');

      showMessage(`נבחר סטטוס: ${status}`);
    }

    async function submitCandidateReview() {
      const notes = document.getElementById('candidateNotes').value.trim();

      const profile     = document.getElementById('candidateProfile');
      const finalStatus = (profile && profile.dataset.selectedStatus) || selectedRecruiterStatus;

      if (!finalStatus) {
        showMessage('בחר קודם סטטוס: מתאים / לא מתאים / יש לבדוק', 'error');
        return;
      }

      const humanScoreEnabled = document.getElementById('humanScoreEnabled').checked;
      const humanScoreSlider  = document.getElementById('humanScoreSlider');
      const humanScore        = humanScoreEnabled ? parseFloat(humanScoreSlider.value) : null;

      const reviewPayload = {
        job_id:   currentJobId,
        cv_id:    currentCandidateId,
        status:   finalStatus,
        feedback: notes,
      };
      if (humanScore !== null) reviewPayload.human_score = humanScore;

      try {
        const res  = await fetch('/api/recruiter/review', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(reviewPayload),
        });
        const data = await res.json();

        if (!res.ok || !data.success) {
          showMessage(data.message || 'שגיאה בשמירת ההערכה', 'error');
          return;
        }

        // Update local state so the list reflects the new status immediately
        const idx = allCandidates.findIndex(c => c.id === currentCandidateId);
        if (idx !== -1) {
          allCandidates[idx].status = finalStatus;
          allCandidates[idx].isNew  = false;
        }

        showMessage('הערכת המועמד נשמרה בהצלחה!');
        selectedRecruiterStatus = null;
        if (profile) profile.dataset.selectedStatus = '';
        loadStats(); // refresh counts after status change

        setTimeout(() => showJobDetails(currentJobId), 1000);

      } catch (err) {
        console.error(err);
        showMessage('שגיאת תקשורת עם השרת', 'error');
      }
    }

    /* ══════════════════════════════════════════════
       VIEW HELPERS
    ══════════════════════════════════════════════ */
    function showDashboard() {
      document.getElementById('dashboardView').style.display          = 'block';
      document.getElementById('jobDetailsView').style.display         = 'none';
      document.getElementById('candidateDetailView').style.display    = 'none';
      document.getElementById('closeJobBtn').style.display            = 'none';
    }

    function showJobDetailsView() {
      document.getElementById('jobDetailsView').style.display         = 'block';
      document.getElementById('candidateDetailView').style.display    = 'none';
      document.getElementById('closeJobBtn').style.display            = 'inline-block';
      applyFilters();
    }

    /* ══════════════════════════════════════════════
       NOTIFICATIONS
    ══════════════════════════════════════════════ */
    function showMessage(message, type) {
      // toast (primary)
      const t = document.getElementById('toast');
      t.textContent = message;
      t.className   = `toast ${type === 'error' ? 'error' : ''} show`;
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 3000);

      // backward-compat banner
      const banner = document.getElementById('successMessage');
      banner.textContent = message;
      banner.classList.add('show');
      setTimeout(() => banner.classList.remove('show'), 3000);
    }

    /* ══════════════════════════════════════════════
       DATE HELPERS
    ══════════════════════════════════════════════ */
    function formatDate(dateString) {
      return new Date(dateString).toLocaleDateString('he-IL');
    }

    function timeAgo(dateString) {
      if (!dateString) return '—';
      const ms      = Date.now() - new Date(dateString).getTime();
      const minutes = Math.floor(ms / 60000);
      const hours   = Math.floor(minutes / 60);
      const days    = Math.floor(hours / 24);
      if (days > 0)    return `לפני ${days} ימים`;
      if (hours > 0)   return `לפני ${hours} שעות`;
      if (minutes > 0) return `לפני ${minutes} דקות`;
      return 'עכשיו';
    }

    /* ══════════════════════════════════════════════
       CLOSE JOB MODAL
    ══════════════════════════════════════════════ */
    function promptCloseJob() {
      document.querySelectorAll('input[name="closeReason"]').forEach(r => r.checked = false);
      document.getElementById('closeJobModal').style.display = 'flex';
    }

    function closeJobModal() {
      document.getElementById('closeJobModal').style.display = 'none';
    }

    async function confirmCloseJob() {
      const selected = document.querySelector('input[name="closeReason"]:checked');
      if (!selected) { alert('יש לבחור סיבת סגירה'); return; }
      closeJobModal();
      try {
        const res = await fetch(`/api/jobs/${currentJobId}/close`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ closed_reason: selected.value }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.success) {
          showMessage('המשרה נסגרה בהצלחה');
          closedJobsLoaded = false;
          showDashboard();
          loadJobsFromApi();
          loadStats();
        } else {
          showMessage(data.message || 'שגיאה בסגירת המשרה', 'error');
        }
      } catch (err) {
        showMessage('שגיאת תקשורת עם השרת', 'error');
      }
    }

    /* ══════════════════════════════════════════════
       INIT
    ══════════════════════════════════════════════ */
    document.addEventListener('DOMContentLoaded', function () {
      loadJobsFromApi();
      loadStats();

      document.getElementById('openTabBtn').onclick = () => {
        currentTab = 'open';
        setActiveTab();
        renderJobsByTab();
      };

      document.getElementById('closedTabBtn').onclick = () => {
        currentTab = 'closed';
        setActiveTab();
        renderJobsByTab();
      };

      document.getElementById('backToJobs').onclick       = showDashboard;
      document.getElementById('backToCandidates').onclick = showJobDetailsView;

      document.getElementById('logoutBtn').onclick = async function () {
        try { await fetch('/logout', { method: 'POST' }); } catch (e) {}
        window.location.href = '/';
      };
    });
  </script>

  <!-- Close Job Modal -->
  <div class="modal-overlay" id="closeJobModal" style="display:none" onclick="if(event.target===this)closeJobModal()">
    <div class="modal-box">
      <div class="modal-title">סגירת משרה — בחר סיבה</div>
      <label class="reason-option">
        <input type="radio" name="closeReason" value="hired"> גויס מועמד מתאים
      </label>
      <label class="reason-option">
        <input type="radio" name="closeReason" value="filled_internally"> אויש מבפנים
      </label>
      <label class="reason-option">
        <input type="radio" name="closeReason" value="canceled"> המשרה בוטלה
      </label>
      <label class="reason-option">
        <input type="radio" name="closeReason" value="manual"> אחר
      </label>
      <div class="modal-actions">
        <button class="modal-confirm-btn" onclick="confirmCloseJob()">סגור משרה</button>
        <button class="modal-cancel-btn" onclick="closeJobModal()">ביטול</button>
      </div>
    </div>
  </div>
</body>
