<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>דף התחברות</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Arial, Helvetica, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .login-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      margin: 20px;
      box-sizing: border-box;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      font-weight: 700;
      color: #1a202c;
      text-align: center;
    }

    .welcome-text {
      color: #718096;
      text-align: center;
      margin: 0 0 32px 0;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #2d3748;
      font-size: 14px;
      text-align: right;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s ease;
      box-sizing: border-box;
      text-align: right;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .forgot-password {
      text-align: left;
      margin-top: 8px;
    }

    .forgot-password a {
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;
      padding: 14px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 24px;
    }

    .login-button:hover {
      background: #5568d3;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .signup-text {
      text-align: center;
      color: #718096;
      font-size: 14px;
      margin-top: 24px;
    }

    .signup-text a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }

    .success-message {
      background: #48bb78;
      color: white;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 500;
      display: none;
    }

    .success-message.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    .success-message.error {
      background: #e53e3e;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="success-message" id="successMessage"></div>

    <div class="logo-section">
      <h1 id="pageTitle">ברוכים השבים</h1>
      <p class="welcome-text" id="welcomeMessage">אנא הזינו את הפרטים שלכם להתחברות</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">אימייל</label>
        <input type="email" id="email" placeholder="הזיני את האימייל שלך" required>
      </div>

      <div class="form-group">
        <label for="password">סיסמה</label>
        <input type="password" id="password" placeholder="הזיני את הסיסמה שלך" required>
        <div class="forgot-password">
          <a href="#" onclick="event.preventDefault(); showMessage('פונקציית איפוס סיסמה עדיין לא ממומשת', true);">
            שכחת סיסמה?
          </a>
        </div>
      </div>

      <button type="submit" class="login-button" id="loginButton">התחברי</button>
    </form>

    <p class="signup-text">
      אין לך חשבון? 
      <a href="#" onclick="event.preventDefault(); showMessage('מודול הרשמה עדיין לא ממומש', true);">
        הרשמה
      </a>
    </p>
  </div>

  <script>
  const loginForm = document.getElementById('loginForm');
  const successBox = document.getElementById('successMessage');

  function showMessage(message, isError = false) {
    successBox.textContent = message;
    successBox.classList.add('show');
    if (isError) {
      successBox.classList.add('error');
    } else {
      successBox.classList.remove('error');
    }
    setTimeout(() => {
      successBox.classList.remove('show');
    }, 3000);
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!email || !password) {
      showMessage('נא למלא אימייל וסיסמה', true);
      return;
    }

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok || !data.success) {
        showMessage(data.message || 'אימייל או סיסמה שגויים', true);
        return;
      }

      const role = data.role;  // מגיע מה־Flask

      showMessage('התחברת כ-' + role + ' ✅', false);

      setTimeout(() => {
        if (role === 'HR_ADMIN') {
          window.location.href = '/dashboard/hr-admin';
        } else if (role === 'HR_MANAGER') {
          window.location.href = '/dashboard/hr-manager';
        } else if (role === 'RECRUITER') {
          window.location.href = '/dashboard/recruiter';
        } else if (role === 'DEVOPS') {
          window.location.href = '/dashboard/devops';
        } else {
          window.location.href = '/dashboard';
        }
      }, 1000);

    } catch (err) {
      console.error(err);
      showMessage('שגיאה בשרת, נסי שוב מאוחר יותר', true);
    }
  });
</script>

</body>
</html>
